<div id="view-keuangan" style="display: none;">
    <div class="order-section-card">
        <div class="order-header-row">
            <span class="order-main-title" style="display: flex; align-items: center; gap: 8px;">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--violet-main);">
                    <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
                    <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                </svg>
                Buku Kas &amp; Pencatatan Pengeluaran
            </span>
        </div>

        <!-- Indikator Saldo Kas Riil & Peringatan Limit Kritis -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0 16px;">
            <div style="background: #f8fafc; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px 16px;">
                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;">
                    <span>SALDO KAS OPERASIONAL</span>
                    <span id="badgeKeuanganKasKritis" style="display: none; background: #fee2e2; color: #dc2626; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; border: 1px solid #fca5a5;">⚠️ KAS KRITIS</span>
                </div>
                <div style="font-size: 20px; font-weight: 900; color: var(--violet-main); margin-top: 4px;" id="keuanganSaldoKas">Rp 0</div>
            </div>
            <div style="background: #f8fafc; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px 16px;">
                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted);">LIMIT SALDO MINIMUM KRITIS</div>
                <div style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-top: 4px;" id="keuanganLimitKas">Rp 2.000.000</div>
            </div>
        </div>

        <div id="alertKasKritisBox" style="display: none; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; color: #9f1239; font-size: 11.5px; line-height: 1.5;">
            <b>Peringatan:</b> Saldo kas operasional saat ini berada di bawah batas minimum yang ditetapkan di Pengaturan. Harap batasi pengeluaran kas atau lakukan penyetoran modal.
        </div>

        <form onsubmit="event.preventDefault(); submitKasManual();"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px;">
            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Tipe Transaksi</label>
                <select class="search-filter-input" style="width: 100%; margin-top: 4px;" id="kasTipe">
                    <option value="Keluar">Kas Keluar (Biaya / Beban)</option>
                    <option value="Masuk">Kas Masuk (Pendapatan Lain)</option>
                </select>
            </div>
            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Kategori Transaksi</label>
                <input type="text" class="search-filter-input" style="width: 100%; margin-top: 4px;"
                    id="kasKategori" placeholder="Contoh: Listrik / Bahan / Sewa" required>
            </div>
            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Nominal (Rp)</label>
                <input type="number" class="search-filter-input" style="width: 100%; margin-top: 4px;"
                    id="kasNominal" required placeholder="0">
            </div>
            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Keterangan Rinci</label>
                <input type="text" class="search-filter-input" style="width: 100%; margin-top: 4px;"
                    id="kasKeterangan" placeholder="Catatan transaksi kas...">
            </div>
            <div style="grid-column: span 2;">
                <button type="submit" class="btn-pill-action btn-pill-primary">Simpan Transaksi Kas</button>
            </div>
        </form>
    </div>
</div>
