<div id="view-pos" style="display: none; height: 100%;">
    <div class="order-section-card" style="height: calc(100vh - 120px); display: flex; flex-direction: column; padding: 20px;">
        <div class="order-header-row" style="margin-bottom: 20px;">
            <span class="order-main-title" style="display: flex; align-items: center; gap: 8px;">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--violet-main);">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                Kasir &amp; Point of Sales (POS)
            </span>
            <div style="display: flex; gap: 12px;">
                <button class="btn-pill-action btn-pill-secondary" onclick="window.tambahBoronganPos()">
                    <svg class="svg-icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Paket / Borongan
                </button>
                <button class="btn-pill-action btn-pill-secondary" onclick="cetakStrukTerakhir()">
                    <svg class="svg-icon-sm" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /><path d="M16 8h-6" /><path d="M16 12H8" /><path d="M16 16h-4" /></svg>
                    Cetak Struk
                </button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1.2fr; gap: 24px; flex: 1; overflow: hidden;">
            
            <!-- Left Side: Product Grid -->
            <div style="display: flex; flex-direction: column; background: #f8fafc; border: 1px solid var(--border-soft); border-radius: 16px; padding: 16px; overflow: hidden;">
                <!-- Search & Categories -->
                <div style="margin-bottom: 16px; display: flex; gap: 12px;">
                    <div style="flex: 1; position: relative;">
                        <input type="text" id="posSearchInput" class="search-filter-input" placeholder="Cari produk..." style="width: 100%; padding-left: 36px; border-radius: 99px;" oninput="window.renderPosProductGrid(this.value)">
                        <svg viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 2;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px;" class="hide-scrollbar" id="posKategoriContainer">
                    <button class="btn-pill-action btn-pill-primary" style="padding: 6px 16px; font-size: 13px; border-radius: 99px; white-space: nowrap;">Semua</button>
                    <button class="btn-pill-action btn-pill-secondary" style="padding: 6px 16px; font-size: 13px; border-radius: 99px; white-space: nowrap; background: #ffffff;">Oleh-Oleh</button>
                    <button class="btn-pill-action btn-pill-secondary" style="padding: 6px 16px; font-size: 13px; border-radius: 99px; white-space: nowrap; background: #ffffff;">Snack & Minuman</button>
                </div>

                <!-- Product Grid -->
                <div id="posProductGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; overflow-y: auto; flex: 1; align-content: flex-start; padding-right: 8px;">
                    <!-- Rendered via JS -->
                </div>
            </div>

            <!-- Right Side: Cart & Checkout -->
            <div style="display: flex; flex-direction: column; overflow-y: auto; padding-right: 4px;">
                <!-- Cart Items -->
                <div style="flex: 1; min-height: 350px; border: 1px solid var(--border-soft); border-radius: 16px; background: #ffffff; padding: 16px; overflow-y: auto; margin-bottom: 16px; box-shadow: 0 4px 15px -4px rgba(15,23,42,0.03);">
                    <h4 style="margin: 0 0 16px 0; color: var(--violet-dark); font-size: 14px; font-weight: 800;">Keranjang Pembelian</h4>
                    <div class="table-responsive-wrapper" style="box-shadow: none; border: none;">
                        <table class="custom-order-table" style="font-size: 12.5px;">
                            <thead style="background: transparent; border-bottom: 1px solid var(--border-soft);">
                                <tr>
                                    <th style="padding-left: 0;">Item</th>
                                    <th>Qty</th>
                                    <th style="text-align: right;">Total</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tblCart"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Checkout Summary -->
                <div style="background: #ffffff; border: 1px solid var(--border-strong); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-subtle);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Diskon</span>
                        <div style="display: flex; gap: 4px;">
                            <select id="posDiskonType" class="hpp-clean-input" style="width: 130px; min-width: 130px; padding: 6px 10px !important; font-size: 12px; font-weight: 600; cursor: pointer;" onchange="renderCart()">
                                <option value="rp">Nominal Tunai</option>
                                <option value="persen">Persen (%)</option>
                            </select>
                            <input type="number" step="any" class="hpp-clean-input" style="width: 100px; padding: 6px 12px !important; text-align: right;" id="posDiskon" value="0" oninput="renderCart()">
                        </div>
                    </div>
                    
                    <div style="background: #f8fafc; border: 1px dashed var(--border-strong); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 12px; display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                            <span>Subtotal</span>
                            <span id="posSubtotalLabel" style="font-weight: 700; color: var(--text-main);">Rp 0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                            <span>Diskon</span>
                            <span id="posDiskonLabel" style="font-weight: 700; color: var(--coral-pink);">Rp 0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px dashed var(--border-soft);">
                            <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; margin: 0;">
                                <input type="checkbox" id="posCheckPpn" onchange="renderCart()" checked style="width: 14px; height: 14px; accent-color: var(--violet-main); cursor: pointer;">
                                <span>PPN (<span id="posPpnRateLabel">11%</span>)</span>
                            </label>
                            <span id="posPpnLabel" style="font-weight: 700; color: var(--violet-main);">Rp 0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--border-strong); font-size: 13px;">
                            <span style="font-weight: 800; color: var(--text-dark);">TOTAL</span>
                            <span id="posTotalLabel" style="font-size: 22px; font-weight: 900; color: var(--violet-main); letter-spacing: -0.5px;">Rp 0</span>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-dark);">
                            <input type="checkbox" id="posCheckWakil" onchange="renderCart()" style="width: 16px; height: 16px; accent-color: var(--violet-main); cursor: pointer;">
                            Aktifkan Mode Wakil (Reseller)
                        </label>
                        <div id="posWakilContainer" style="display: none; background: #fff8f1; border: 1px solid #ffd8a8; border-radius: 12px; padding: 12px; margin-top: 8px; flex-direction: column; gap: 8px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 11px; font-weight: 700; color: #d97706;">Persentase Wakil (%)</span>
                                <input type="number" id="posWakilPersen" value="10" min="0" max="100" class="hpp-clean-input" style="width: 70px; text-align: center; border-color: #ffd8a8; color: #b45309;" oninput="renderCart()">
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text-muted);">
                                <span>Bagian Perusahaan:</span>
                                <span id="posWakilPerusahaanLbl" style="color: var(--text-main); font-weight: 700;">Rp 0</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text-muted);">
                                <span>Bagian Wakil:</span>
                                <span id="posWakilLbl" style="color: #ea580c; font-weight: 700;">Rp 0</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                        <div>
                            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">Pelanggan</label>
                            <select class="search-filter-input" style="width: 100%; padding: 8px; font-size: 12px;" id="posCustomer" onchange="window.handlePosCustomerChange()">
                                <option value="CUST-UMUM">Pelanggan Umum</option>
                                <option value="CUST-001">Oleh-Oleh Barokah</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">Pembayaran</label>
                            <select class="search-filter-input" style="width: 100%; padding: 8px; font-size: 12px;" id="posPaymentMethod" onchange="window.togglePosPaymentInputs()">
                                <option value="Tunai">Tunai (Kas)</option>
                                <option value="Tempo">Tempo (Piutang)</option>
                                <option value="Tabungan">Saldo Tabungan</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Payment Input Card (Tunai) -->
                    <div id="posPaymentInputs" style="margin-bottom: 18px; background: #ffffff; padding: 16px; border-radius: 16px; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.05);">
                        <!-- Header Label -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <div style="display: flex; align-items: center; gap: 7px;">
                                <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: #ede9fe; color: var(--violet-main);">
                                    <svg style="width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2;" viewBox="0 0 24 24"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
                                </span>
                                <span style="font-size: 12px; font-weight: 800; color: var(--text-dark);">Uang Tunai Diterima</span>
                            </div>
                            <button type="button" onclick="window.posClearUangBayar()" id="posBtnResetUang" style="display: none; border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.15s ease;" onmouseover="this.style.color='var(--coral-pink)'" onmouseout="this.style.color='var(--text-muted)'">Reset</button>
                        </div>

                        <!-- Currency Input Box with Rp Prefix -->
                        <div style="position: relative; display: flex; align-items: center; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 6px 14px; margin-bottom: 12px; transition: all 0.2s ease; box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);" id="posInputWrapper">
                            <span style="font-size: 13px; font-weight: 800; color: var(--violet-main); background: #ede9fe; padding: 4px 8px; border-radius: 6px; margin-right: 10px; user-select: none;">Rp</span>
                            <input type="text" inputmode="numeric" id="posUangBayar" style="width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 900; color: #0f172a; outline: none; letter-spacing: -0.5px; padding: 2px 0;" placeholder="0" oninput="window.handlePosUangInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();window.posHandleEnterSubmit();}" onfocus="document.getElementById('posInputWrapper').style.borderColor='var(--violet-main)'; document.getElementById('posInputWrapper').style.boxShadow='0 0 0 3px rgba(108,71,255,0.15)';" onblur="document.getElementById('posInputWrapper').style.borderColor='#cbd5e1'; document.getElementById('posInputWrapper').style.boxShadow='inset 0 1px 2px rgba(0,0,0,0.03)';">
                        </div>

                        <!-- Quick Denomination Chips -->
                        <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;" id="posQuickCashGroup">
                            <button type="button" onclick="window.posQuickCash('pas')" class="pos-chip-btn" id="btnChipPas" style="flex: 1.2; min-width: 85px; padding: 7px 10px; font-size: 11.5px; font-weight: 800; border-radius: 8px; border: 1.5px solid #818cf8; background: linear-gradient(135deg, #eef2ff 0%, #ede9fe 100%); color: #4338ca; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; justify-content: center;">
                                Uang Pas
                            </button>
                            <button type="button" onclick="window.posQuickCash(10000)" class="pos-chip-btn" style="flex: 1; min-width: 58px; padding: 7px 8px; font-size: 11.5px; font-weight: 700; border-radius: 8px; border: 1.5px solid #e2e8f0; background: #ffffff; color: #334155; cursor: pointer; transition: all 0.15s ease;">10.000</button>
                            <button type="button" onclick="window.posQuickCash(20000)" class="pos-chip-btn" style="flex: 1; min-width: 58px; padding: 7px 8px; font-size: 11.5px; font-weight: 700; border-radius: 8px; border: 1.5px solid #e2e8f0; background: #ffffff; color: #334155; cursor: pointer; transition: all 0.15s ease;">20.000</button>
                            <button type="button" onclick="window.posQuickCash(50000)" class="pos-chip-btn" style="flex: 1; min-width: 58px; padding: 7px 8px; font-size: 11.5px; font-weight: 700; border-radius: 8px; border: 1.5px solid #e2e8f0; background: #ffffff; color: #334155; cursor: pointer; transition: all 0.15s ease;">50.000</button>
                            <button type="button" onclick="window.posQuickCash(100000)" class="pos-chip-btn" style="flex: 1; min-width: 58px; padding: 7px 8px; font-size: 11.5px; font-weight: 700; border-radius: 8px; border: 1.5px solid #e2e8f0; background: #ffffff; color: #334155; cursor: pointer; transition: all 0.15s ease;">100.000</button>
                        </div>

                        <!-- Direct Resulting Amount Display (Kembalian / Minus Kurang) -->
                        <div id="posKembalianFeedbackBox" style="display: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; align-items: center; justify-content: center; text-align: center; transition: all 0.2s ease;">
                            <span id="posFeedbackAmount" style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; line-height: 1;"></span>
                        </div>

                        <!-- Tabungan Pelanggan Switch Card -->
                        <label id="posTabunganOptionCard" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: all 0.15s ease;" onmouseover="this.style.background='#f1f5f9';" onmouseout="this.style.background='#f8fafc';">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <svg style="width: 16px; height: 16px; color: var(--violet-main); fill: none; stroke: currentColor; stroke-width: 2;" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
                                <div>
                                    <span style="font-size: 11.5px; font-weight: 700; color: var(--text-dark); display: block;">Simpan ke Tabungan</span>
                                    <span style="font-size: 10.5px; color: var(--text-muted);">Alihkan kembalian ke saldo tabungan</span>
                                </div>
                            </div>
                            <input type="checkbox" id="posSimpanTabungan" style="width: 17px; height: 17px; accent-color: var(--violet-main); cursor: pointer;">
                        </label>
                    </div>

                    <!-- Tabungan Payment Info Card (Active when payment method is Tabungan) -->
                    <div id="posTabunganInfoCard" style="display: none; margin-bottom: 18px; background: #ffffff; padding: 16px; border-radius: 16px; border: 1.5px solid #818cf8; box-shadow: 0 4px 16px -4px rgba(99, 102, 241, 0.1);">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; background: #e0e7ff; color: #4338ca;">
                                    <svg style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2;" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
                                </span>
                                <span style="font-size: 12px; font-weight: 800; color: #1e1b4b;">Pembayaran Saldo Tabungan</span>
                            </div>
                            <span id="posTabunganBadgeStatus" style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #e0e7ff; color: #4338ca;">Member</span>
                        </div>
                        <div style="background: #f8fafc; border-radius: 12px; padding: 12px; border: 1px solid #e2e8f0;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                <span style="font-size: 11.5px; color: var(--text-muted); font-weight: 600;">Saldo Tabungan:</span>
                                <span id="posTabunganCurrentAmount" style="font-size: 14px; font-weight: 800; color: var(--emerald);">Rp 0</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 6px;">
                                <span style="font-size: 11.5px; color: var(--text-muted); font-weight: 600;">Sisa Setelah Bayar:</span>
                                <span id="posTabunganRemainingAmount" style="font-size: 14px; font-weight: 800; color: var(--violet-main);">Rp 0</span>
                            </div>
                        </div>
                        <div id="posTabunganAlertMsg" style="font-size: 11px; font-weight: 600; color: #64748b; margin-top: 8px;"></div>
                    </div>

                    <button id="posBtnSubmit" class="btn-pill-action btn-pill-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 99px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); box-shadow: 0 8px 24px -4px rgba(79, 70, 229, 0.35); transition: all 0.2s ease; display: flex; align-items: center; gap: 8px;" onclick="submitTransaksiPOS()" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 10px 28px -4px rgba(79, 70, 229, 0.45)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 8px 24px -4px rgba(79, 70, 229, 0.35)';">
                        <svg style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2;" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                        Proses Pembayaran
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
