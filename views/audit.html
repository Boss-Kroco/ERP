<div id="view-audit" style="display: none;">
    <div class="order-section-card">
        <div class="order-header-row">
            <span class="order-main-title" style="display: flex; align-items: center; gap: 8px;">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--violet-main);">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
                Log Audit Trail Sensitif (Khusus Owner &amp; Admin)
            </span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="search-filter-box">
                    <span class="table-search-icon">
                        <svg class="svg-icon-sm" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </span>
                    <input type="text" class="search-filter-input" id="searchAuditTable"
                        placeholder="Cari log..." oninput="filterAuditLogs()">
                </div>
                <button class="btn-pill-action btn-pill-secondary" onclick="fetchAuditLogs()">Segarkan Log</button>
            </div>
        </div>
        <div class="table-responsive-wrapper">
            <table class="custom-order-table">
                <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Waktu</th>
                        <th>User</th>
                        <th>Modul</th>
                        <th>Aksi</th>
                        <th>Nilai Lama</th>
                        <th>Nilai Baru</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tblAuditLogs"></tbody>
            </table>
        </div>
    </div>
</div>
