<div id="view-sewa" style="display: none; height: 100%;">
    <div style="display: grid; grid-template-columns: 2.2fr 1fr; gap: 12px; height: calc(100vh - 72px);">
        
        <!-- Bagian Kiri: Daftar Alat -->
        <div class="pos-left-panel" style="display: flex; flex-direction: column; gap: 10px; height: 100%;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="search-filter-box" style="flex: 1;">
                    <span class="table-search-icon">
                        <svg class="svg-icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </span>
                    <input type="text" id="inpCariAlat" class="search-filter-input" placeholder="Cari nama alat berat / mesin..." oninput="if(window.filterAlatSewa) window.filterAlatSewa()">
                </div>
                <button class="btn-pill-action btn-pill-secondary" style="height: 100%; white-space: nowrap;" onclick="if(window.bukaModalTambahAlat) window.bukaModalTambahAlat()">+ Tambah Alat</button>
            </div>
            
            <div id="gridAlatSewa" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; overflow-y: auto; padding-right: 4px; flex: 1; align-content: flex-start;">
                <!-- Alat akan dirender di sini via JS -->
            </div>
        </div>

        <!-- Bagian Kanan: Keranjang Sewa -->
        <div class="pos-right-panel" style="background: var(--bg-card); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; border: 1px solid var(--border-soft);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="margin: 0; font-size: 13.5px; color: var(--violet-dark); font-weight: 700;">Keranjang Sewa</h3>
                <span style="font-size: 10px; color: var(--text-muted); font-weight: 600; background: #f8fafc; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border-soft);">Diskon Item &amp; Nota</span>
            </div>
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 3px;">Data Penyewa (Pelanggan)</label>
                <input type="text" id="inpPenyewaSewa" class="search-filter-input" style="width: 100%;" placeholder="Nama penyewa / proyek...">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 3px;">Durasi Sewa (Hari)</label>
                <input type="number" id="inpDurasiSewa" class="search-filter-input" style="width: 100%;" value="1" min="1" oninput="if(window.hitungTotalSewa) window.hitungTotalSewa()">
            </div>

            <!-- Diskon Nota Sewa (Sama seperti Fitur Kasir) -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px;">
                <div>
                    <span style="font-size: 11px; font-weight: 800; color: #1e293b;">Diskon Nota Sewa</span>
                    <div style="font-size: 9.5px; color: #64748b; font-weight: 500;">Opsional seluruh nota</div>
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <select id="sewaDiskonType" class="hpp-clean-input" style="width: 105px; min-width: 105px; padding: 5px 8px !important; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff;" onchange="window.handleSewaDiskonTypeChange()">
                        <option value="nominal" id="optSewaDiskonRp">Nominal (<span class="app-currency-symbol">Rp</span>)</option>
                        <option value="persen">Persen (%)</option>
                    </select>
                    <div style="position: relative; display: flex; align-items: center;">
                        <span id="sewaDiskonPrefixBadge" style="position: absolute; left: 8px; font-size: 10px; font-weight: 800; color: #64748b; pointer-events: none;">Rp</span>
                        <input type="number" step="any" min="0" class="hpp-clean-input" style="width: 86px; padding: 5px 8px 5px 24px !important; text-align: right; font-size: 11.5px !important; font-weight: 700; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff;" id="sewaDiskon" value="0" placeholder="0" oninput="if(window.hitungTotalSewa) window.hitungTotalSewa()">
                    </div>
                </div>
            </div>

            <div style="flex: 1; overflow-y: auto; border-top: 1px dashed var(--border-soft); border-bottom: 1px dashed var(--border-soft); padding: 8px 0; margin-bottom: 10px;" id="listKeranjangSewa">
                <div style="text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 16px;">Belum ada alat yang dipilih.</div>
            </div>
            
            <div>
                <div style="background: #f8fafc; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 11px; display: flex; flex-direction: column; gap: 6px;">
                    <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                        <span>Subtotal (<span id="lblDurasiSewaInfo">1 Hari</span>)</span>
                        <span id="lblSubtotalSewa" style="font-weight: 700; color: var(--text-main);">Rp 0</span>
                    </div>
                    <div id="rowDiskonSewa" style="display: flex; justify-content: space-between; color: var(--text-muted);">
                        <span>Diskon</span>
                        <span id="lblDiskonSewa" style="font-weight: 700; color: var(--coral-pink);">Rp 0</span>
                    </div>
                    <!-- Supermarket-style Savings Box -->
                    <div id="boxHematSewa" style="display: none; background: #ecfdf5; border: 1px dashed #10b981; border-radius: 6px; padding: 4px 8px; text-align: center; color: #047857; font-size: 10.5px; font-weight: 800;">
                        🎉 Hemat Belanja: <span id="lblHematSewa">Rp 0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid var(--border-strong); font-size: 12px;">
                        <span style="font-weight: 800; color: var(--text-dark);">TOTAL BAYAR</span>
                        <span id="lblTotalSewa" style="font-size: 18px; font-weight: 900; color: var(--violet-main); letter-spacing: -0.5px;">Rp 0</span>
                    </div>
                </div>
                
                <button class="btn-pill-action btn-pill-primary" style="width: 100%; padding: 8px 12px; font-size: 12.5px; display: flex; justify-content: center; margin-bottom: 6px;" onclick="if(window.prosesSewa) window.prosesSewa()">
                    <svg class="svg-icon-sm" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    Proses Transaksi
                </button>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-pill-action btn-pill-secondary" style="flex: 1; padding: 7px 10px; font-size: 11.5px; display: flex; justify-content: center;" onclick="if(window.cetakStrukSewaCurrent) window.cetakStrukSewaCurrent()">
                        <svg class="svg-icon-sm" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
                        Cetak Struk
                    </button>
                    <button class="btn-pill-action btn-pill-secondary" style="flex: 1; padding: 7px 10px; font-size: 11.5px; display: flex; justify-content: center; background: #25D366; color: white;" onclick="if(window.kirimWaSewa) window.kirimWaSewa()">
                        <svg class="svg-icon-sm" style="stroke: white;" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        Kirim WA
                    </button>
                </div>
            </div>
            
            <!-- Modal Tambah Alat (Premium Glassmorphism) -->
            <div id="modalTambahAlatSewa" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center;">
                <div class="modal-card" style="background: #ffffff; padding: 32px; border-radius: 24px; width: 420px; max-width: 90%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                        <div style="background: var(--violet-surface); color: var(--violet-main); padding: 10px; border-radius: 12px;">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        </div>
                        <h3 style="margin: 0; font-size: 22px; color: var(--violet-dark); font-weight: 800; letter-spacing: -0.5px;">Tambah Alat Baru</h3>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <div>
                            <label style="font-size: 13px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">ID Alat (SKU)</label>
                            <input type="text" id="inpIdAlatBaru" class="search-filter-input" style="width: 100%; padding: 12px; font-size: 14px; border-radius: 12px; background: #f8fafc; font-weight: 600;" readonly>
                        </div>
                        <div>
                            <label style="font-size: 13px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Nama Alat Berat / Mesin</label>
                            <input type="text" id="inpNamaAlatBaru" class="search-filter-input" style="width: 100%; padding: 12px; font-size: 14px; border-radius: 12px; border: 1px solid var(--border-strong);" placeholder="Contoh: Genset 10.000 Watt">
                        </div>
                        <div>
                            <label style="font-size: 13px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Harga Sewa (<span class="app-currency-symbol">Rp</span> / Hari)</label>
                            <input type="number" step="any" id="inpHargaAlatBaru" class="search-filter-input" style="width: 100%; padding: 12px; font-size: 15px; border-radius: 12px; border: 1px solid var(--border-strong); color: var(--violet-dark); font-weight: 700;" placeholder="0">
                        </div>
                        <div>
                            <label style="font-size: 13px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Stok Awal (Qty)</label>
                            <input type="number" id="inpQtyAlatBaru" class="search-filter-input" style="width: 100%; padding: 12px; font-size: 14px; border-radius: 12px; border: 1px solid var(--border-strong);" value="1">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border-soft);">
                        <button class="btn-pill-action btn-pill-secondary" style="padding: 12px 24px; border-radius: 12px; font-weight: 600;" onclick="document.getElementById('modalTambahAlatSewa').style.display = 'none'">Batal</button>
                        <button class="btn-pill-action btn-pill-primary" style="padding: 12px 24px; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);" onclick="if(window.simpanAlatBaru) window.simpanAlatBaru()">Simpan ke Katalog</button>
                    </div>
                </div>
            </div>
            
            <!-- Elemen Struk Tersembunyi -->
            <div id="printStrukArea" style="display: none;"></div>
        </div>
        
    </div>
</div>
