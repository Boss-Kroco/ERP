<div id="view-sewa" style="display: none; height: 100%;">
    <div style="display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; height: calc(100vh - 100px);">
        
        <!-- Bagian Kiri: Daftar Alat -->
        <div class="pos-left-panel" style="display: flex; flex-direction: column; gap: 12px; height: 100%;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="search-filter-box" style="flex: 1;">
                    <span class="table-search-icon">
                        <svg class="svg-icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </span>
                    <input type="text" id="inpCariAlat" class="search-filter-input" placeholder="Cari nama alat berat / mesin..." oninput="if(window.filterAlatSewa) window.filterAlatSewa()">
                </div>
                <button class="btn-pill-action btn-pill-secondary" style="height: 100%; white-space: nowrap;" onclick="if(window.bukaModalTambahAlat) window.bukaModalTambahAlat()">+ Tambah Alat</button>
            </div>
            
            <div id="gridAlatSewa" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; overflow-y: auto; padding-right: 5px; flex: 1; align-content: flex-start;">
                <!-- Alat akan dirender di sini via JS -->
            </div>
        </div>

        <!-- Bagian Kanan: Keranjang Sewa -->
        <div class="pos-right-panel" style="background: var(--bg-card); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; border: 1px solid var(--border-soft);">
            <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 15px; color: var(--violet-dark); font-weight: 700;">Keranjang Sewa</h3>
            
            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Data Penyewa (Pelanggan)</label>
                <input type="text" id="inpPenyewaSewa" class="search-filter-input" style="width: 100%;" placeholder="Nama penyewa / proyek...">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Durasi Sewa (Hari)</label>
                <input type="number" id="inpDurasiSewa" class="search-filter-input" style="width: 100%;" value="1" min="1" oninput="if(window.hitungTotalSewa) window.hitungTotalSewa()">
            </div>

            <div style="flex: 1; overflow-y: auto; border-top: 1px dashed var(--border-soft); border-bottom: 1px dashed var(--border-soft); padding: 10px 0; margin-bottom: 15px;" id="listKeranjangSewa">
                <div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px;">Belum ada alat yang dipilih.</div>
            </div>
            
            <div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--text-muted);">
                    <span>Subtotal (<span id="lblDurasiSewaInfo">1 Hari</span>)</span>
                    <span id="lblSubtotalSewa" style="font-weight: 600; color: var(--text-dark);">Rp 0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: 800; color: var(--violet-main);">
                    <span>TOTAL BAYAR</span>
                    <span id="lblTotalSewa">Rp 0</span>
                </div>
                
                <button class="btn-pill-action btn-pill-primary" style="width: 100%; padding: 12px; font-size: 15px; display: flex; justify-content: center;" onclick="if(window.prosesSewa) window.prosesSewa()">
                    <svg class="svg-icon-sm" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    Proses & Cetak Struk
                </button>
            </div>
            
            <!-- Modal Tambah Alat (Hidden initially) -->
            <div id="modalTambahAlatSewa" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center;">
                <div class="modal-card" style="background: var(--bg-card); padding: 20px; border-radius: 12px; width: 400px; max-width: 90%;">
                    <h3 style="margin-top: 0;">Tambah Alat Baru</h3>
                    <div style="margin-bottom: 10px;">
                        <label>ID Alat</label>
                        <input type="text" id="inpIdAlatBaru" class="search-filter-input" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label>Nama Alat</label>
                        <input type="text" id="inpNamaAlatBaru" class="search-filter-input" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label>Harga Sewa (/hari)</label>
                        <input type="number" id="inpHargaAlatBaru" class="search-filter-input" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label>Stok/Qty</label>
                        <input type="number" id="inpQtyAlatBaru" class="search-filter-input" style="width: 100%;">
                    </div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button class="btn-pill-action btn-pill-secondary" onclick="document.getElementById('modalTambahAlatSewa').style.display = 'none'">Batal</button>
                        <button class="btn-pill-action btn-pill-primary" onclick="if(window.simpanAlatBaru) window.simpanAlatBaru()">Simpan</button>
                    </div>
                </div>
            </div>
            
            <!-- Elemen Struk Tersembunyi -->
            <div id="printStrukArea" style="display: none;"></div>
        </div>
        
    </div>
</div>
