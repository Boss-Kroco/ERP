<div id="view-produk" style="display: none;">
    <div class="order-section-card">
        <div class="order-header-row" style="flex-wrap: wrap; gap: 10px;">
            <span class="order-main-title" style="display: flex; align-items: center; gap: 8px;">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--violet-main);">
                    <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
                    <path d="M7 7h.01" />
                </svg>
                Master Katalog &amp; Stok Multi-Lokasi
            </span>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button class="btn-pill-action btn-pill-secondary" onclick="window.tambahKategoriBaruPrompt()" style="border-radius: 12px; font-size: 11.5px; padding: 6px 12px;">
                    + Kategori Baru
                </button>
                <button class="btn-pill-action btn-pill-primary" onclick="openModalTambahProduk()" style="border-radius: 12px; font-size: 11.5px; padding: 6px 12px;">
                    <svg class="svg-icon-sm" viewBox="0 0 24 24">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Tambah Produk Baru
                </button>
            </div>
        </div>

        <!-- Toolbar Pencarian & Filter Kategori (Item 6 & 7) -->
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; background: #f8fafc; padding: 10px 14px; border-radius: 14px; border: 1px solid #e2e8f0;">
            <div style="flex: 1; min-width: 200px; position: relative;">
                <input type="text" id="searchMasterProduk" oninput="window.filterMasterProdukRealtime()" class="search-filter-input" placeholder="Cari nama produk, kode ID, atau satuan..." style="width: 100%; border-radius: 12px; padding: 7px 12px 7px 32px; font-size: 12px;">
                <svg class="svg-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <div style="min-width: 160px;">
                <select id="filterKategoriMasterProduk" onchange="window.filterMasterProdukRealtime()" class="search-filter-input" style="width: 100%; border-radius: 12px; padding: 7px 12px; font-size: 12px;">
                    <option value="">Semua Kategori</option>
                </select>
            </div>
            <div style="min-width: 140px;">
                <select id="sortMasterProduk" onchange="window.filterMasterProdukRealtime()" class="search-filter-input" style="width: 100%; border-radius: 12px; padding: 7px 12px; font-size: 12px;">
                    <option value="az">Urut A - Z (Abjad)</option>
                    <option value="za">Urut Z - A</option>
                    <option value="stok_desc">Stok Terbanyak</option>
                    <option value="stok_asc">Stok Tersedikit</option>
                </select>
            </div>
        </div>
        <div class="table-responsive-wrapper">
            <table class="custom-order-table">
                <thead>
                    <tr>
                        <th>Kode ID</th>
                        <th>Nama Produk</th>
                        <th>Satuan</th>
                        <th>HPP Acuan</th>
                        <th>Harga Jual</th>
                        <th>Stok Etalase</th>
                        <th>Stok Gudang</th>
                        <th>Status</th>
                        <th style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tblMasterProduk"></tbody>
            </table>
        </div>
    </div>
</div>
